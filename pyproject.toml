[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "antstudio-google-chat-plugin"
version = "0.2.1"
description = "Local, user-authorized Google Chat MCP integration for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Antstudio" }]
dependencies = [
  "mcp>=1.9,<2",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
google-chat-plugin = "google_chat_plugin.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/google_chat_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
